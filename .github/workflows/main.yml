name: Gold and Forex Signal Alert V4

on:
  schedule:
    - cron: "2 6 * * *"
    - cron: "17,32,47 6 * * *"
    - cron: "2,17,32,47 7-20 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  market-signal:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install requirements
        run: pip install pandas numpy scikit-learn websocket-client

      - name: Send daily Telegram status
        if: github.event_name == 'schedule' && github.event.schedule == '2 6 * * *'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from gold_ai_signal_alert import telegram_send

          now_wat = datetime.now(ZoneInfo("Africa/Lagos"))
          message = (
              f"DAILY BOT STATUS — {now_wat.strftime('%A, %d %B %Y')}\n\n"
              "Gold and Forex Signal Alert V4 is active.\n"
              "Monitoring Deriv XAUUSD, EUR/USD, GBP/USD and USD/JPY "
              "every 15 minutes during the WAT session.\n\n"
              "BUY/SELL alerts will be sent only when a qualified setup appears. "
              "WAIT results remain silent."
          )
          if not telegram_send(message):
              raise SystemExit("Daily Telegram status could not be delivered.")
          PY

      - name: Verify all Deriv market feeds
        if: github.event_name == 'workflow_dispatch'
        run: |
          python - <<'PY'
          from gold_ai_signal_alert import download_deriv_market

          markets = {
              "XAUUSD": "frxXAUUSD",
              "EURUSD": "frxEURUSD",
              "GBPUSD": "frxGBPUSD",
              "USDJPY": "frxUSDJPY",
          }
          for name, symbol in markets.items():
              candles = download_deriv_market(symbol)
              latest = candles.iloc[-1]
              print(
                  f"Deriv {name} feed OK: {len(candles)} completed candles; "
                  f"last close={latest['close']}; time={latest['timestamp']}"
              )
          PY

      - name: Send Telegram connection test
        if: github.event_name == 'workflow_dispatch'
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          from gold_ai_signal_alert import telegram_send

          token = "".join(os.getenv("TELEGRAM_BOT_TOKEN", "").split())
          if not token:
              raise SystemExit("TELEGRAM_BOT_TOKEN is missing.")
          with urllib.request.urlopen(
              f"https://api.telegram.org/bot{token}/getMe", timeout=20
          ) as response:
              bot_info = json.load(response)
          username = bot_info.get("result", {}).get("username", "unknown")
          print(f"Telegram bot configured in GitHub: @{username}")

          message = (
              "MULTI-MARKET SIGNAL ALERT V4 CONNECTED. Deriv feeds verified "
              "for XAUUSD, EUR/USD, GBP/USD and USD/JPY. Checking every "
              "15 minutes during the WAT session. This is a connection test, "
              "not a live trade."
          )
          if not telegram_send(message):
              raise SystemExit("Telegram connection test failed.")
          PY

      - name: Validate Gmail secret format
        if: github.event_name == 'workflow_dispatch'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          import hashlib
          import os

          user = os.getenv("GMAIL_USER", "").strip()
          password = "".join(os.getenv("GMAIL_APP_PASSWORD", "").split())
          user_matches = (
              hashlib.sha256(user.lower().encode()).hexdigest()
              == "aa5f06eee8fb3a9ef88037ce0ae1c909575505c127f4eda573c947808077bb64"
          )
          print(
              "Gmail secret format: "
              f"user_set={bool(user)}, has_at={'@' in user}, "
              f"matches_expected_account={user_matches}, "
              f"password_characters={len(password)} (expected 16)"
          )
          if not user or "@" not in user:
              raise SystemExit("GMAIL_USER is missing or is not an email address.")
          if len(password) != 16:
              raise SystemExit(
                  "GMAIL_APP_PASSWORD must contain exactly 16 characters "
                  "after spaces are removed."
              )
          PY

      - name: Send Gmail connection test
        if: github.event_name == 'workflow_dispatch'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PY'
          from gold_ai_signal_alert import email_send

          message = (
              "MULTI-MARKET SIGNAL ALERT V4 CONNECTED. Deriv feeds verified "
              "for XAUUSD, EUR/USD, GBP/USD and USD/JPY. Checking every "
              "15 minutes during the WAT session. This is a connection test, "
              "not a live trade."
          )
          if not email_send("Multi-Market Signal Alert V4 Connected", message):
              raise SystemExit("Gmail connection test failed.")
          PY

      - name: Check Gold and forex signals
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python gold_ai_signal_alert.py | tee scan_output.txt

      - name: Build live dashboard signal overlay
        run: |
          python update_dashboard_signals.py
          rm -f scan_output.txt

      - name: Persist dashboard signal state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest_signals.json
          if git diff --cached --quiet; then
            echo "No dashboard signal change to publish."
          else
            git commit -m "Update live V4 dashboard signal"
            git push
          fi
